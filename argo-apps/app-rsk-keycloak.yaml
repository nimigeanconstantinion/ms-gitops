apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rsk-keycloak
  namespace: argocd
  annotations:
    # wave 4: dupa Keycloak Operator + Keycloak CR (wave 3). KeycloakRealmImport
    # e procesat de operator, deci realm-ul apare dupa ce Keycloak e ready.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/nimigeanconstantinion/ms-gitops.git
    targetRevision: master
    path: business/rsk/keycloak
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: auth

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # CRD-ul KeycloakRealmImport apare abia dupa ce keycloak-operator se instaleaza.
      - SkipDryRunOnMissingResource=true
