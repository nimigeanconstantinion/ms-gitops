_format_version: "3.0"

upstreams:
  - name: importer-service-upstream
    targets:
      - target: importer-service.business.svc:8082
        weight: 100

services:
  - name: importer-service
    host: importer-service-upstream
    port: 8082
    protocol: http
    routes:
      - name: importer-service
        hosts:
          - importer-service.icode.mywire.org