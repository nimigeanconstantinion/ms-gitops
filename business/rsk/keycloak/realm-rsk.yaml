# Realm importat declarativ. Contine realm-ul rsk, demo-client + configuratiile din json.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: rsk-realm
  namespace: auth
spec:
  keycloakCRName: keycloak
  realm:
    id: rsk
    realm: rsk
    enabled: true
    displayName: "RSK Realm"
    registrationAllowed: true

    # --- CLIENȚI ---
    clients:
      # Client de test pentru token via direct access grant (curl/Postman) — fără redirect.
      - clientId: demo-client
        enabled: true
        publicClient: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: true
        redirectUris: []
        webOrigins: []

      - clientId: new-client
        enabled: true
        publicClient: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: true
        redirectUris: []
        webOrigins: []

      # Adăugat din JSON: react-client (Frontend). Redirect-uri EXACTE (fără "*").
      - clientId: react-client
        protocol: openid-connect
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: true
        redirectUris:
          - "http://localhost:5174/*"
          - "http://localhost:5000/*"
          - "http://react-app.local/*"
          - "http://192.168.0.112/*"
          - "http://localhost:3000/*"
          - "http://client/*"
        webOrigins:
          - "+"
        attributes:
          pkce.code.challenge.method: "S256"
          post.logout.redirect.uris: "+"

      # Client dedicat pentru Swagger UI (OAuth2 authorizationCode + PKCE), stil car-platform.
      # - clientId: data-service-swagger
      #   name: "Data Service Swagger"
      #   protocol: openid-connect
      #   enabled: true
      #   publicClient: true
      #   standardFlowEnabled: true
      #   directAccessGrantsEnabled: false
      #   redirectUris:
      #     - "http://localhost:8081/swagger-ui/oauth2-redirect.html"
      #     - "https://data.icode.mywire.org/swagger-ui/oauth2-redirect.html"
      #   webOrigins:
      #     - "http://localhost:8081"
      #     - "https://data.icode.mywire.org"
      #   attributes:
      #     pkce.code.challenge.method: "S256"

# Client dedicat pentru Swagger UI (OAuth2 authorizationCode + PKCE), stil react-client.
      - clientId: data-service-swagger
        name: "Data Service Swagger"
        protocol: openid-connect
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: true # Activat la fel ca la react-client pentru compatibilitate maximă în dev
        redirectUris:
          - "http://localhost:8081/swagger-ui/oauth2-redirect.html"
          - "https://data.icode.mywire.org/swagger-ui/oauth2-redirect.html"
        webOrigins:
          - "+" # Folosim "+" la fel ca la react-client pentru a prelua automat originile din redirectUris (previne problemele de CORS)
        attributes:
          pkce.code.challenge.method: "S256"
          post.logout.redirect.uris: "+" # Adăugat la fel ca la react-client

      # oauth2-proxy: poarta de auth (network gate) inainte de Kong, stil car-platform.
      # Client confidential FARA secret in fisier -> Keycloak il genereaza; il pui intr-un
      # SealedSecret (oauth2-proxy-keycloak) la bootstrap. Vezi business/rsk/oauth2-proxy/README.md.
      - clientId: oauth2-proxy
        name: "OAuth2 Proxy"
        protocol: openid-connect
        enabled: true
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris:
          - "https://data-service.icode.mywire.org/oauth2/callback"
        webOrigins:
          - "+"
        defaultClientScopes:
          - "openid"
          - "profile"
          - "email"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              "claim.name": "groups"
              "full.path": "true"
              "access.token.claim": "true"
              "id.token.claim": "true"
              "userinfo.token.claim": "true"

      # Adăugat din JSON: registration-service (Service account cu secret explicit)
      - clientId: registration-service
        name: "Registration Service Client"
        protocol: openid-connect
        enabled: true
        publicClient: false
        bearerOnly: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        clientAuthenticatorType: "client-secret"
        secret: "my-secret-keycloak"
        fullScopeAllowed: true
        redirectUris: []
        webOrigins: []
        defaultClientScopes:
          - "openid"
          - "profile"

    # --- GRUPURI --- (oauth2-proxy lasa sa treaca doar membrii /admins)
    groups:
      - name: admins

    # --- UTILIZATORI COPIAȚI DIN JSON ---
    users:
      - username: test
        enabled: true
        emailVerified: true
        credentials:
          - type: password
            value: test
            temporary: false
        realmRoles:
          - "USER"
        clientRoles:
          account:
            - "view-profile"

      - username: admin
        enabled: true
        emailVerified: true
        credentials:
          - type: password
            value: admin
            temporary: false
        realmRoles:
          - "ADMIN"
        groups:
          - "/admins"